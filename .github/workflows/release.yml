name: Release

# Three stages, each gating the next:
#   test            - full mvn verify (185 tests, JaCoCo, SpotBugs) - the
#                      actual quality gate, never skipped to make the
#                      container build easier
#   build-and-push   - packages the jar `test` already built and verified
#                      (not a fresh rebuild) into the production Dockerfile,
#                      scans it, pushes to GHCR - except on pull_request,
#                      where it still builds (catches a broken Dockerfile in
#                      review) but never pushes
#   release          - only on a version tag: creates the GitHub Release
#
# WHY the checkout looks like this: same root cause as ci.yml - auth-service
# now resolves its own parent (iiotedge-parent) from GitHub Packages, but
# its iiotedge-audit-starter / com.iotmining.common:data / :base dependencies
# still come from the separate `common` repo, built from source, never
# published anywhere. Those modules' own <parent> is a local relative path
# to the `iotmining` root pom.xml (two directories up), so that still needs
# checking out even though auth-service's own parent no longer does. Unlike
# ci.yml, no module-list trimming is needed here: that was only required for
# the old reactor-style `-pl -am` build of auth-service through the
# microservices aggregator, which auth-service no longer needs now that it
# builds standalone.
#
# REQUIRES two repo secrets:
#   PLATFORM_REPO_TOKEN - a PAT (classic or fine-grained) with read access
#     to iiotedge/iotmining, iiotedge/common, AND read:packages on
#     iiotedge/platform-build (auth-service's parent/BOM now come from
#     there over the network, not a checkout)
#   (GITHUB_TOKEN, provided automatically, is used for GHCR push)
# Untested against a live runner - the Docker build/run and `mvn verify`
# steps were verified locally (including a real `docker build`+`docker run`
# smoke test), but the GitHub Packages network resolution step could only be
# confirmed as far as a 401 (right URL, no local credentials) - see
# platform-build's TODO.md.

on:
  push:
    branches: [main]
    tags: ['v*.*.*', '20*.*.*']
  pull_request:
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/iiotedge/auth-service
  JAVA_VERSION: '21'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout iotmining (parent pom for common/data, common/base, common/audit)
        uses: actions/checkout@v4
        with:
          repository: iiotedge/iotmining
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          path: iotmining

      - name: "Checkout common (shared modules: data, base, audit)"
        uses: actions/checkout@v4
        with:
          repository: iiotedge/common
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          path: iotmining/common

      - name: Checkout auth-service
        uses: actions/checkout@v4
        with:
          path: auth-service

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # auth-service's parent (iiotedge-parent) and its BOM import now
      # resolve from GitHub Packages over the network, not a checkout -
      # needs real credentials in CI the same way a dev machine does (see
      # platform-build's README "Dev machine setup").
      - name: Write GitHub Packages settings.xml
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
        run: |
          SETTINGS="$RUNNER_TEMP/gpr-settings.xml"
          cat > "$SETTINGS" <<XML
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>github</id>
                <username>${GH_ACTOR}</username>
                <password>${GH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
          echo "GPR_SETTINGS=$SETTINGS" >> "$GITHUB_ENV"

      - name: Install shared modules (common/data, common/base, common/audit)
        run: |
          mvn -B -s "$GPR_SETTINGS" -f iotmining/common/data/pom.xml install -DskipTests
          mvn -B -s "$GPR_SETTINGS" -f iotmining/common/base/pom.xml install -DskipTests
          mvn -B -s "$GPR_SETTINGS" -f iotmining/common/audit/pom.xml install -DskipTests

      - name: Build & verify auth-service
        run: mvn -B -s "$GPR_SETTINGS" -f auth-service/pom.xml clean verify

      - name: Upload SpotBugs/JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            auth-service/target/spotbugsXml.xml
            auth-service/target/site/jacoco/
          if-no-files-found: ignore

      # Hand the exact jar that just passed the quality gate to the next
      # job, rather than letting it rebuild - "build once, promote the
      # artifact" instead of risking a second build silently differing.
      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: auth-service/target/auth-service.jar
          retention-days: 7

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout auth-service (Dockerfile only - jar comes from the test job)
        uses: actions/checkout@v4

      - name: Record build timestamp
        id: timestamp
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: auth-service-jar
          path: target

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.timestamp.outputs.value }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=auth-service
          cache-to: type=gha,mode=max,scope=auth-service

      # Scans the image that was just built, before it's pushed anywhere -
      # uploads results to the Security tab regardless of findings; only
      # fails the job on CRITICAL so a known-but-accepted Medium/High
      # finding doesn't block every build (matches this platform's SpotBugs
      # convention: baseline what's accepted, don't blanket-ignore).
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.timestamp.outputs.value }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=auth-service

  release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Image: \`${{ env.IMAGE_NAME }}:${GITHUB_REF_NAME#v}\` (also tagged \`sha-${GITHUB_SHA}\`)"
