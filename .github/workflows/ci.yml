name: CI

# WHY THIS WORKFLOW LOOKS LIKE THIS (not a plain "checkout + mvn verify"):
#
# auth-service/pom.xml resolves its parent (com.iotmining:microservices ->
# com.iotmining:iotmining-technology) via local relative paths
# (<relativePath>../pom.xml</relativePath>), and its iiotedge-audit-starter /
# com.iotmining.common:data / com.iotmining.common:base dependencies come
# from the separate "common" repo - built from source, never published to a
# registry. Unlike tenant-management-service (which already resolves its
# parent from GitHub Packages and can build standalone), a plain checkout
# of just this repo can't resolve its own parent POM.
#
# This workflow reconstructs the minimum local layout Maven needs -
# checking out the iotmining root (for the parent POM chain) and common
# (for the shared modules) alongside this repo - then builds from there.
# See TODO.md for the real fix (publish the parent chain + shared modules
# to GitHub Packages, matching tenant-management-service's setup).
#
# REQUIRES: a repo secret named PLATFORM_REPO_TOKEN - a PAT (classic or
# fine-grained) with read access to IotMining/iotmining and IotMining/common,
# added under this repo's Settings > Secrets and variables > Actions.
# Untested against a live runner - verify the checkout paths and the repo/
# branch names still match before relying on this gate for merges.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # Order matters: iotmining and common are checked out first, since
      # each is a clean checkout of its own tracked tree - if it happened
      # to also track something at microservices/auth-service (stale
      # content from before that path became its own repo), checking it
      # out after auth-service could silently overwrite that checkout.
      # auth-service goes last so nothing after it can clobber it.
      - name: Checkout iotmining (parent POM chain)
        uses: actions/checkout@v4
        with:
          repository: IotMining/iotmining
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          path: iotmining

      - name: Checkout common (shared modules: data, base, audit)
        uses: actions/checkout@v4
        with:
          repository: IotMining/common
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          path: iotmining/common

      - name: Checkout auth-service
        uses: actions/checkout@v4
        with:
          path: iotmining/microservices/auth-service

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Both the root iotmining/pom.xml (8 modules: common/audit,
      # common/security, common/interfaces, common/base, common/proto,
      # common/data, common/utils, monitoring-agent, microservices) and
      # microservices/pom.xml (~20 service modules) list far more than
      # what's actually checked out here - the reactor fails at module
      # discovery for anything listed but missing, before -pl even gets a
      # chance to scope the build. Trims both to exactly what auth-service
      # needs, only in this ephemeral CI checkout - never touches the real
      # iotmining/common repos. Verified against a local simulation of this
      # exact checkout layout (BUILD SUCCESS, 185/185 tests) before this
      # workflow was added.
      - name: Scope the reactor to what auth-service actually needs
        run: |
          python3 - <<'PYEOF'
          import re

          def set_modules(path, modules):
              with open(path) as f:
                  content = f.read()
              replacement = "<modules>\n" + "".join(f"        <module>{m}</module>\n" for m in modules) + "    </modules>"
              content = re.sub(r"<modules>.*?</modules>", replacement, content, flags=re.DOTALL)
              with open(path, "w") as f:
                  f.write(content)

          set_modules("iotmining/pom.xml", ["common/audit", "common/base", "common/data", "microservices"])
          set_modules("iotmining/microservices/pom.xml", ["auth-service"])
          PYEOF

      - name: Install shared modules (common/data, common/base, common/audit)
        run: |
          mvn -B -f iotmining/common/data/pom.xml install -DskipTests
          mvn -B -f iotmining/common/base/pom.xml install -DskipTests
          mvn -B -f iotmining/common/audit/pom.xml install -DskipTests

      - name: Build & verify auth-service
        run: mvn -B -f iotmining/pom.xml -pl microservices/auth-service -am verify

      - name: Upload SpotBugs/JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            iotmining/microservices/auth-service/target/spotbugsXml.xml
            iotmining/microservices/auth-service/target/site/jacoco/
          if-no-files-found: ignore
