global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-app'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:8082']  # Replace with your application's address

  - job_name: 'prometheus'

    static_configs: 
      - targets: ['localhost:9090']
