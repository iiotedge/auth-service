spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/iotmining
    username: postgres
    password: 8506
    hikari:
      pool-name: LoginServicePool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 2000
      max-lifetime: 1800000
  jpa:
    hibernate:
#      ddl-auto: create-drop
      ddl-auto: update
    database: postgresql
#    database-platform: org.hibernate.dialect.PostgreSQLDialect
  redis:
    host: localhost  # The Redis service name in Docker Compose (could be 'localhost' in dev environments)
    port: 6379   # Default Redis port
    password: 8506  # Password for Redis if authentication is enabled
    redis:
      pool:
        max-active: 10  # Maximum number of connections in the Redis connection pool
        max-idle: 5     # Maximum number of idle connections
        min-idle: 1     # Minimum number of idle connections
        max-wait: 2000  # Maximum wait time (in ms) to get a connection from the pool
    timeout: 2000  # Connection timeout for Redis (in ms)

rate:
  limit:
    max-requests: 10  # Max 10 requests per minute
    time-window: 1     # 1 minute time window
    error-message: "Too many requests. Please try again in a few seconds."

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tryItOutEnabled: true

logging:
  config: classpath:log4j2.xml
service:
  name: Login-service

server:
  port: 8051

jwt:
  secret: "Vlo2vcFdiXGgWqZLEpLw6kk99sH8/4odgC2XgZV0IbA="

cors:
  allowed-origins: ${ALLOWED_CORS_ORIGINS:http://localhost:3000}

tenant:
  service:
    url: ${TMS_SERVICE_URL:http://localhost:8083/api/v1/tenants}

notification:
  service:
    url: http://localhost:8087

otp:
  ttl:
    seconds: 300   # 5 minutes
  max:
    attempts: 5
  resend:
    max:
      per:
        hour: 3
  source:
    app: auth-service

