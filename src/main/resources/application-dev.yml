spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/iotmining
    username: postgres
    password: 8506
    hikari:
      pool-name: LoginServicePool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 2000
      max-lifetime: 1800000
  jpa:
    hibernate:
    #  ddl-auto: create-drop
      ddl-auto: update
    database: postgresql
#    database-platform: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost  # The Redis service name in Docker Compose (could be 'localhost' in dev environments)
      port: 6379   # Default Redis port
      password: 8506  # Password for Redis if authentication is enabled
      timeout: 2000  # Connection timeout for Redis (in ms)

rate:
  limit:
    max-requests: 10  # Max 10 requests per minute
    time-window: 1     # 1 minute time window (RateLimitAspect reads this as minutes)
    error-message: "Too many requests. Please try again in a few seconds."

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tryItOutEnabled: true

logging:
  config: classpath:log4j2.xml
service:
  name: Login-service

server:
  port: 8051

# Local dev Eureka commonly runs with basic auth (admin/8506, the same
# convention used for the DB/Redis passwords above) - kept as a fallback
# default purely for local testing convenience. Override via
# EUREKA_SERVICE_URL if your local Eureka isn't configured that way.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://admin:8506@localhost:8761/eureka/}

jwt:
  secret: "Vlo2vcFdiXGgWqZLEpLw6kk99sH8/4odgC2XgZV0IbA="

# Local-dev-only default so the seeded super admin still works out of the
# box; production has no fallback (see application-prod.yml) - never reuse
# this value outside a local environment.
admin:
  seed:
    password: ${SUPER_ADMIN_PASSWORD:DevOnly@Passw0rd1}

cors:
  allowed-origins: ${ALLOWED_CORS_ORIGINS:http://localhost:3000}

tenant:
  service:
    url: ${TMS_SERVICE_URL:http://localhost:8083/api/v1/tenants}

notification:
  service:
    # Was hardcoded to 8087, which nothing actually listens on -
    # notification-service's real dev port is 8059 (see its own
    # application.yml). Every OTP send silently failed against a
    # connection-refused error caught and swallowed by sendOtpInternalJwt.
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8059}

otp:
  ttl:
    seconds: 300   # 5 minutes
  max:
    attempts: 5
  resend:
    max:
      per:
        hour: 3
  source:
    app: auth-service

