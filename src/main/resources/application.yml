spring:
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  application:
    name: IoTMining-Auth-Service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Runs schema.sql (ShedLock's lock table - not a JPA entity, so
  # ddl-auto never creates it) on every boot; defer-datasource-initialization
  # ensures Hibernate's own entity tables are created first.
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
server:
  port: 8051

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
    prometheus:
      enabled: true  # Make sure this is enabled
  metrics:
    export:
      prometheus:
        enabled: true  # Enable Prometheus export
    enable:
      jvm: true  # Ensure JVM metrics are enabled

# service-url.defaultZone is profile-specific (see application-dev.yml /
# application-prod.yml) since dev's own local Eureka needs credentials in
# the URL and prod's doesn't - keeping one shared default here meant either
# baking a credential into the profile-agnostic base file (so it silently
# applies to prod too if EUREKA_SERVICE_URL is ever left unset there) or
# dropping it from dev's convenient local default. Splitting per profile
# avoids both.
eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true  # Use IP instead of hostname for discovery
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

iiotedge:
  audit:
    enabled: true
    application-name: "iiotedge-auth-service"
    kafka-topic: "audit.events.v1"

# 7 Days in milliseconds
app:
  jwt:
    refreshExpirationMs: 604800000