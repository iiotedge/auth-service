spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB1_URL}
    username: ${DB1_USERNAME}
    password: ${DB1_PASSWORD}
    hikari:
      pool-name: LoginProdServicePool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update #create-drop
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: kafka-service:9092
  data:
    redis:
      host: ${REDIS_HOST:redis}           # From Kubernetes ConfigMap or default to 'redis'
      port: ${REDIS_PORT:6379}            # Default Redis port
      password: ${REDIS_PASSWORD}         # Required - no fallback, use a K8s Secret in production
      timeout: ${REDIS_TIMEOUT:2000}      # Connection timeout (ms)

rate:
  limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}                 # Default: 10 requests
    # RateLimitAspect reads this as minutes, not seconds - this key
    # previously read "time-window-seconds", which RateLimitAspect never
    # looked up, so this setting was silently ignored in prod.
    time-window: ${RATE_LIMIT_TIME_WINDOW_MINUTES:1}            # 1 minute window
    error-message: ${RATE_LIMIT_ERROR_MESSAGE:Too many requests. Please try again in a few seconds.}

cors:
  allowed-origins: ${ALLOWED_CORS_ORIGINS:https://iiotedge.in,https://demo.iiotedge.in}

tenant:
  service:
    url: ${TMS_SERVICE_URL:http://localhost:9061/api/v1/tenants}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:9059}

# Required - no fallback. The dev profile's secret is a known, published
# value; letting prod silently fall back to it if the env var is unset
# would mean prod validates tokens signed with a publicly-visible key.
jwt:
  secret: ${JWT_SECRET_KEY_BASE64}

admin:
  seed:
    password: ${SUPER_ADMIN_PASSWORD:}

# No embedded credential in the default, unlike dev's local convenience
# fallback (application-dev.yml) - a real prod Eureka's auth belongs in
# EUREKA_SERVICE_URL (or a K8s Secret feeding it), not a source-committed default.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

