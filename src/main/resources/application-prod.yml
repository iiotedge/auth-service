spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB1_URL}
    username: ${DB1_USERNAME}
    password: ${DB1_PASSWORD}
    hikari:
      pool-name: LoginProdServicePool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update #create-drop
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: kafka-service:9092
  redis:
    host: ${REDIS_HOST:redis}           # From Kubernetes ConfigMap or default to 'redis'
    port: ${REDIS_PORT:6379}            # Default Redis port
    password: ${REDIS_PASSWORD:8506}    # Use K8s Secret in production
    timeout: ${REDIS_TIMEOUT:2000}      # Connection timeout (ms)

    redis:
      pool:
        max-active: ${REDIS_POOL_MAX_ACTIVE:10}
        max-idle: ${REDIS_POOL_MAX_IDLE:5}
        min-idle: ${REDIS_POOL_MIN_IDLE:1}
        max-wait: ${REDIS_POOL_MAX_WAIT:2000} # in ms

rate:
  limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}            # Default: 10 requests
    time-window-seconds: ${RATE_LIMIT_TIME_WINDOW:60}      # 60s = 1 minute
    error-message: ${RATE_LIMIT_ERROR_MESSAGE:Too many requests. Please try again in a few seconds.}

cors:
  allowed-origins: ${ALLOWED_CORS_ORIGINS:http://localhost:3000}

tenant:
  service:
    url: ${TMS_SERVICE_URL:http://localhost:8081/api/v1/tenants}

jwt:
